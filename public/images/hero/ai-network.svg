      <stop offset="0%" stop-color="#0F2A2A" />
      <stop offset="55%" stop-color="#0C111B" />
      <stop offset="100%" stop-color="#07080D" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#14B8A6" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nodeGlowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.5" />
